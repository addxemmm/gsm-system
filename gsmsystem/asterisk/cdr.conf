; 2.1 native call-detail records / 原生通话明细。
; Records represent channel legs/attempts, not guaranteed completed conversations.
; 明细可能是一段通道或一次尝试，不等同于一通已接通电话。
[general]
enable=yes
unanswered=yes
batch=no
safeshutdown=yes

[csv]
; Keep storage UTC across timezone changes; the API converts display timestamps.
; 持久记录固定 UTC，避免切换时区混淆历史；API 输出时转换展示时区。
usegmtime=yes
loguniqueid=yes
loguserfield=yes
; /var/log/asterisk is persisted below /data/log/asterisk by the entrypoint.
; 入口将日志目录持久化到 /data/log/asterisk，不覆盖旧记录。
