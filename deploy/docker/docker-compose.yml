# gsm-system 2.1 production compose (Ubuntu 22.04 + OpenBTS 5 + UHD 4.1).
# The deployment script reads this resolved input to select the API overlay.
# 部署脚本读取此插值开关选择 API overlay；Compose 本身不据此发布端口。
x-gsm-expose-api: "${GSM_EXPOSE_API:-false}"
services:
  gsm-system:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: "${GSM_VERSION:-2.1.0}"
        REVISION: "${GSM_REVISION:-unknown}"
    # The operator-visible/runtime tag stays at the release line. Source
    # traceability lives in the OCI revision label, not in extra image tags.
    # 运行镜像固定使用发布线 tag；源码追踪由 OCI revision 标签承载。
    image: "${GSM_IMAGE:-gsm-system:2.1}"
    # Stable production identity retained across release recreations.
    # 发布重建时保持稳定的生产容器名。
    container_name: gsmsystem-uhd4
    labels:
      com.gsm-system.managed: "true"
    # One explicit bridge gives the runtime one stable uplink name: eth0.
    # The Go `network` field and MASQUERADE endpoint refer to this container
    # interface, never to a host NIC such as ens33.
    networks:
      - gsm-bridge
    ports:
      # Default: publish the Web console only. Its same-origin /api/v1 uses
      # the same optional Bearer authentication; hiding a port is not auth.
      # 默认仅发布 Web；同源 API 使用同一鉴权，隐藏端口不等于鉴权。
      - "${GSM_BIND_ADDRESS:-0.0.0.0}:${GSM_WEB_PORT:-8080}:8080/tcp"
    sysctls:
      # GPRS packets enter via sgsntun and leave via eth0 in this namespace.
      net.ipv4.ip_forward: "1"
    privileged: true
    # Manual start only: do not launch after host/Docker restart or process exit.
    # 仅手动启动：宿主机/Docker 重启或容器退出后均不自动拉起。
    restart: "no"
    init: true
    stop_grace_period: 90s
    healthcheck:
      # Process-free status probe: do not repeatedly claim/probe the SDR.
      # 仅查状态，避免健康检查周期性探测或占用 SDR。
      test: ["CMD", "/usr/local/bin/gsm-system", "--healthcheck"]
      interval: 60s
      timeout: 35s
      start_period: 30s
      retries: 3
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - gsm-data:/data
    environment:
      # One timezone for container/native logs/API; CDR storage remains UTC.
      # 容器、原生日志与 API 使用统一时区；CDR 持久记录仍为 UTC。
      TZ: "${TZ:-Asia/Shanghai}"
      GSM_CONFIG: /app/configs/app.yaml
      # Independent API is loopback-only unless the API Compose overlay is used.
      # 独立 API 默认仅容器内回环监听；显式启用 overlay 才对外开放。
      GSM_LISTEN: "127.0.0.1:8082"
      GSM_WEB_LISTEN: ":8080"
      GSM_WEB_ENABLED: "true"
      GSM_WEB_PUBLIC_ORIGIN: "${GSM_WEB_PUBLIC_ORIGIN:-}"
      # Optional Bearer auth from repository-root .env: blank disables it.
      # 可选 Bearer 鉴权来自项目根 .env：留空关闭，非空启用；不要提交密钥。
      GSM_API_TOKEN: "${GSM_API_TOKEN:-}"
      # Fresh-volume packet-data DNS; existing native settings are preserved.
      # 仅新卷首次初始化采用，旧卷 GPRS 配置保留。
      GSM_GPRS_DNS: "${GSM_GPRS_DNS:-1.1.1.1}"
      UHD_IMAGES_DIR: /usr/share/uhd/images
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  gsm-data:
    # Keep the existing data volume when using a new release project name.
    # 切换发布项目名称时仍使用现有卷，保留配置及签约。
    name: "${GSM_DATA_VOLUME:-docker_gsm-data}"
    # Lifecycle is operator-owned, not tied to compose down -v.
    # 数据卷由运维显式管理，避免随 Compose 项目删除。
    external: true

networks:
  gsm-bridge:
    driver: bridge
    ipam:
      config:
        # Separate from GPRS 192.168.99.0/24 and the deployed LTE bridge.
        # Override only after checking every host/container route for overlap.
        - subnet: "${GSM_BRIDGE_SUBNET:-172.31.240.0/24}"
