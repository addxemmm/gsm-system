; Exact routes in phones take precedence over its registry-dialing wildcard.
; phones 中的精确分机优先于注册库通配路由，避免测试号码被当作外部号码。
[phones](+)
exten => 2600,1,Goto(gsm-diagnostics,2600,1)
exten => 2602,1,Goto(gsm-diagnostics,2602,1)

[default](+)
exten => 2600,1,Goto(gsm-diagnostics,2600,1)
exten => 2602,1,Goto(gsm-diagnostics,2602,1)

[gsm-diagnostics]
; Echo test, # exits. One-minute cap also releases abandoned test calls.
; 回声测试，# 退出；最多一分钟，避免遗留测试占用语音信道。
exten => 2600,1,Set(TIMEOUT(absolute)=60)
 same => n,Set(CDR(hangupdirection)=A)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup(16)

; Digital milliwatt tone; independent of optional prompt/audio packages.
; 数字毫瓦测试音，不依赖可选语音文件包，最多三十秒。
exten => 2602,1,Set(TIMEOUT(absolute)=30)
 same => n,Set(CDR(hangupdirection)=A)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Milliwatt()
 same => n,Hangup(16)
