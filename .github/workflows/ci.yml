name: ci
on:
  push:
    branches: [master, folk/**]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.26.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh deploy/docker/test-persistent-state.sh
      - run: sh deploy/docker/test-timezone.sh
      - run: sh scripts/tests/test_prefetch_vendor.sh
      - run: sh scripts/tests/test_deploy_to_ubuntu.sh
      - run: sh scripts/tests/test_build_contract.sh
      - run: REVISION=$(git rev-parse --short=12 HEAD) make linux && ./bin/gsm-system-linux-amd64 --version

  windows-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pwsh -NoProfile -File scripts/tests/deploy_from_windows.Tests.ps1
      - run: node scripts/tests/postman_start_modes.test.cjs
      - run: node scripts/tests/web_ui.test.cjs
