# folk/uhd4 experiment compose (22.04 + UHD 4.1 + clone FPGA).
# Kept separate from the main line; promotes to deploy/docker/ on success.
services:
  gsm-system-uhd4:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.uhd4
    image: gsmsystem-uhd4:test
    container_name: gsmsystem-uhd4
    network_mode: host
    privileged: true
    restart: "no"
    init: true
    stop_grace_period: 90s
    healthcheck:
      # Process-free status probe: do not repeatedly claim/probe the SDR.
      # 仅查状态，避免健康检查周期性探测或占用 SDR。
      test: ["CMD-SHELL", "curl --fail --silent --max-time 30 -H \"Authorization: Bearer $$GSM_API_TOKEN\" http://127.0.0.1:8082/api/v1/cell >/dev/null"]
      interval: 60s
      timeout: 35s
      start_period: 30s
      retries: 3
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - gsm-data:/data
    environment:
      GSM_CONFIG: /app/configs/app.yaml
      # Canonical GSM API port (v2 retired, :8082 is free).
      GSM_LISTEN: "${GSM_LISTEN:-:8082}"
      # Optional bearer authentication; set via a host-only --env-file.
      # 可选 Bearer 鉴权：通过服务器专用 --env-file 注入，不提交密钥。
      GSM_API_TOKEN: "${GSM_API_TOKEN:-}"
      UHD_IMAGES_DIR: /usr/share/uhd/images
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  gsm-data:
    # Keep the existing data volume when using a new release project name.
    # 切换发布项目名称时仍使用现有卷，保留配置及签约。
    name: "${GSM_DATA_VOLUME:-docker_gsm-data}"
