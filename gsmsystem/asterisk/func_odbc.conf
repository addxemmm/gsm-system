[SQL]
dsn=asterisk
readsql=${ARG1}

; Resolve caller identity from the configured peer selected by chan_sip. SQL_ESC is
; still applied after the dialplan allow-list so a future naming change stays safe.
; 仅通过 chan_sip 已选定的本机配置 peer 解析主叫；白名单后仍做 SQL 转义。
[CALLERID_BY_PEER]
dsn=asterisk
readsql=SELECT callerid FROM sip_buddies WHERE name='${SQL_ESC(${ARG1})}'
