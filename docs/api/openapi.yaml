openapi: 3.0.3
info:
  title: gsm-system API
  version: 2.1.0
  license: { name: MIT, url: 'https://opensource.org/license/mit' }
  description: |
    Bilingual-contract companion for the Go management plane / Go 管理面机器契约。
    All public routes are under /api/v1. Root legacy routes are retired.
    A new preset store contains editable defaults with IDs "0" through "4".
    A successful SMS response means submitted, never delivered.
servers:
  - url: http://HOST:8082
    description: Replace HOST with the SDR host / 将 HOST 替换为 SDR 服务器
security:
  - bearerAuth: []
  - {}
tags:
  - { name: cell, description: Cell lifecycle / 小区生命周期 }
  - { name: presets, description: Operator-managed cell presets / 操作员管理的小区预设 }
  - { name: config, description: Configuration and profile / 配置与存档 }
  - { name: subscribers, description: Connections and subscribers / 连接与签约 }
  - { name: messaging, description: SMS submission and observation / 短信提交与观察 }
  - { name: calls, description: Asterisk call observations / Asterisk 通话观察 }
  - { name: operations, description: Health and networking / 健康与网络 }

paths:
  /api/v1/cell:
    get:
      tags: [cell]
      operationId: getCell
      summary: Inspect managed process state / 查询小区进程状态
      responses:
        '200': { $ref: '#/components/responses/CellStatusOK' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [cell]
      operationId: startCell
      summary: Start explicitly, from a preset, or by reusing the last profile / 启动小区
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CellStart' }
            examples:
              preset:
                summary: Start from one stored preset / 使用已存储预设启动
                value: { preset_id: '0' }
              custom:
                summary: Start from one complete custom profile / 使用完整自定义配置启动
                value: { arfcns: '1', c0: '540', band: '1800', mcc: '001', mnc: '01', lac: '1', ci: '1', short_name: addx, network: eth0 }
              reuseSavedProfile:
                summary: Reuse the existing valid last profile / 复用已有有效的上次存档
                value: {}
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [cell]
      operationId: stopCell
      summary: Idempotently stop the cell, TERM before KILL / 幂等停止小区
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/presets:
    get:
      tags: [presets]
      operationId: listPresets
      summary: List presets; a new store has defaults "0" through "4" / 列出预设，新库初始有五套默认项
      description: |
        Defaults are editable: 0 addx/1800/C0 540; 1 ChinaMobile/900/C0 55;
        2 ChinaMobile/1800/C0 540; 3 ChinaUnicom/900/C0 70; and
        4 ChinaUnicom/1800/C0 668. All use arfcns/lac/ci "1" and network eth0.
      responses:
        '200': { $ref: '#/components/responses/PresetListOK' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [presets]
      operationId: createPreset
      summary: Persist a complete named cell preset; does not start a cell / 创建预设，不启动小区
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetCreate' }
      responses:
        '201':
          $ref: '#/components/responses/PresetCreated'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/presets/{id}:
    parameters:
      - $ref: '#/components/parameters/PresetID'
    get:
      tags: [presets]
      operationId: getPreset
      summary: Read one preset / 读取单个预设
      responses:
        '200': { $ref: '#/components/responses/PresetOK' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      tags: [presets]
      operationId: updatePreset
      summary: Replace preset metadata and params; path ID is immutable / 替换预设，路径 ID 不可变
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetUpdate' }
      responses:
        '200': { $ref: '#/components/responses/PresetOK' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      tags: [presets]
      operationId: deletePreset
      summary: Delete one preset without changing the running cell / 删除预设，不影响运行中小区
      responses:
        '200': { $ref: '#/components/responses/PresetDeleted' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: List OpenBTS configuration / 查询 OpenBTS 配置
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
    patch:
      tags: [config]
      operationId: patchConfig
      summary: Update one or more keys while stopped / 停机更新一个或多个键
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPatch' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/profile:
    get:
      tags: [config]
      operationId: getProfile
      summary: Read the saved non-secret cell profile / 读取小区存档
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Read control-plane health; not RF acceptance / 管理面健康检查
      description: time is RFC3339 in the startup-configured project TZ, default Asia/Shanghai / time 使用项目启动配置 TZ 的带偏移 RFC3339 时间，默认东八区
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/connections:
    get:
      tags: [subscribers]
      operationId: getConnections
      summary: Observe volatile registration/TMSI rows, not online state / 查询易失注册/TMSI 观察行，非在线状态
      description: Subscriber-registry number bindings and unbindings override stale TMSI numbers; inconsistent registry rows return a null number. The response source remains the TMSI/SGSN observation source. / 签约库号码绑定与解绑覆盖陈旧 TMSI 号码；签约库不一致时号码为空。响应来源仍表示 TMSI/SGSN 观察来源。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/ConnectionsOK' }
        '401': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/subscribers:
    get:
      tags: [subscribers]
      operationId: getSubscribers
      summary: List persistent subscriber registrations / 查询持久签约
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/SubscribersOK' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/subscribers/{imsi}:
    parameters:
      - $ref: '#/components/parameters/IMSI'
    get:
      tags: [subscribers]
      operationId: getSubscriber
      summary: Read one persistent subscriber / 查询单条签约
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/subscribers/{imsi}/number:
    parameters:
      - $ref: '#/components/parameters/IMSI'
    put:
      tags: [subscribers]
      operationId: bindSubscriberNumber
      summary: Transactionally bind a unique number / 事务绑定唯一号码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NumberBinding' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      tags: [subscribers]
      operationId: unbindSubscriberNumber
      summary: Transactionally remove a number binding / 事务解绑号码
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/sms:
    get:
      tags: [messaging]
      operationId: getSMS
      summary: Parse current-start smqueue observations / 读取本轮启动短信观察
      description: |
        Scope is always current_start, with no all-history switch. Only the latest
        known cell-start window is read. Stop/degraded preserves that round until
        the next accepted start; failure of an accepted attempt clears it.
        Validation rejection and duplicate-start 409 preserve the existing boundary.
        A recreated manager has no known
        session and returns HTTP 200 with sms=[], count=total=0, session=null,
        without adopting or deleting old logs. Pagination and max_history_bytes
        apply within this session; prior-start bytes do not imply truncation.
        One rename rotation to .1 is supported. A lost or unverifiable boundary
        (for example after multiple rotations) returns HTTP 200 empty with
        session.state=boundary_lost, never unrelated history. Real I/O errors
        such as permission failures return HTTP 500; missing sessions are not 404.
        timezone is the startup-configured IANA zone (TZ), default Asia/Shanghai.
        Native offset-less timestamps use that zone; time is nullable RFC3339Nano
        with an offset (or Z for UTC). Session timestamps use RFC3339 offsets.
        running only means the observation window is not frozen, not cell readiness;
        query GET /api/v1/cell for readiness. Scope selects this log observation
        window, not original message creation time; persistent-queue messages
        reprocessed or replayed in this round can still appear.
        范围固定 current_start，无历史开关。停止/降级保留该轮至下次已接受的启动，
        已接受启动尝试失败才清空；参数拒绝或重复启动 409 保留边界。
        管理进程重建后无已知会话，返回 200 空列表和 session=null，不读取或
        删除旧日志。分页及字节上限在本轮内生效，排除上一轮字节不视为截断。
        支持一次 rename 轮转至 .1；边界丢失或多次轮转后不可验证时返回 200
        空观察和 boundary_lost，不回退历史；
        权限等真实读取错误返回 500，无会话不是 404。
        TZ 在项目启动前配置，默认 Asia/Shanghai 东八区；原生无偏移时间按此解析，
        短信时间输出带偏移 RFC3339Nano，会话起止输出 RFC3339，UTC 可使用 Z。
        running 只表示窗口未冻结，不保证小区 ready，就绪状态查询 GET /api/v1/cell。
        范围是本次日志观察窗口，不按短信最初创建时刻筛选；持久队列在本次重新
        处理或重放的短信仍可能出现。
        Preferentially parses keyed `GSM_SMS_V1` NOTICE observations whose
        qtag/from/to/text values are hex encoded to preserve exact content and
        prevent log-line injection. The qtag merges matching legacy NOTICE
        evidence within one process generation. Older `Got SMS rqst qtag ...`
        events retain only evidenced time and parties; unkeyed Decoded text is
        never associated and remains null rather than fabricating content.
        Explicitly keyed text and complete local detailed delivery blocks remain
        supported. Entries are deduplicated by message identity, not content;
        missing identity complements are filled only from a unique, consistent
        current subscriber binding. Per-field identity_resolution distinguishes
        log observations, query-time current binding context, and unknowns. Log
        values are never overwritten; 101/411 service codes remain without an
        IMSI. Current bindings are not historical facts or delivery receipts.
        优先解析 hex 编码 qtag/收发方/正文的结构化 `GSM_SMS_V1` NOTICE，准确保留
        内容并防止日志行注入；同一进程代际内按 qtag 合并旧 NOTICE 证据。旧 NOTICE
        仅保留有证据的时间与收发方；不带身份的 Decoded 正文一律不关联并保持为空。
        显式 keyed 正文及完整局部详细日志继续支持。按消息身份而非内容去重；无证据
        身份缺项仅由唯一且一致的当前签约绑定补全；identity_resolution 逐字段区分
        日志观察、查询时当前绑定和未知。日志值绝不覆盖，101/411 服务短码不补 IMSI；
        当前绑定不是历史事实，观察记录也不是送达回执。
        Patched native receive decoding supports BMP UCS-2 DCS 0x08 and
        0x18..0x1b as UTF-8 text, with bounded UDH skipping and length checks.
        Concatenated segments remain separate observations. Malformed payloads,
        unsupported DCS and surrogate code units remain unknown (null), not
        guessed from raw hex. Native forwarding preserves DCS/UDHI/raw data;
        POST /sms remains restricted to safe ASCII.
        原生接收支持 BMP UCS-2 DCS 0x08、0x18..0x1b 转 UTF-8，检查长度并跳过有界
        UDH；长短信片段不重组。畸形数据、未知 DCS 和代理码元保持 null，不猜测正文。
        原生转发保留 DCS/UDHI/原始数据，POST /sms 仍限安全 ASCII。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/SMSListOK' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [messaging]
      operationId: submitSMS
      summary: Submit safe-ASCII SMS directly through OpenBTS CLI / 提交短信
      description: |
        At most 159 bytes from the documented safe ASCII/GSM-default-basic
        intersection. No UCS-2, Chinese, extension-table characters, quotes, or
        backticks. HTTP 202 acknowledges submission only, never delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SMSSubmit' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/calls:
    get:
      tags: [calls]
      operationId: getActiveCalls
      summary: Read active Asterisk channels / 查询活动 Asterisk 通道
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/ActiveCallsOK' }
        '401': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/calls/history:
    get:
      tags: [calls]
      operationId: getCallHistory
      summary: Parse real Asterisk CSV CDR in the project time zone / 按项目时区读取真实 CDR
      description: Each item maps all 18 configured cdr_csv columns. Native timestamps remain UTC in storage and are displayed in startup-configured TZ (default Asia/Shanghai) with RFC3339 offsets. / 每项映射完整18列；原始时间保持 UTC 存储，输出按启动配置 TZ（默认 Asia/Shanghai）转换为带偏移 RFC3339。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/CallHistoryOK' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/network:
    get:
      tags: [operations]
      operationId: getNetworkRule
      summary: Inspect the managed MASQUERADE rule / 查询网络规则
      description: ipv4_forwarding is read-only and nullable; this API never changes sysctl / 仅只读转发状态
      parameters:
        - name: iface
          in: query
          required: false
          description: Required when no saved profile exists / 无存档时必填
          schema: { type: string, example: eth0 }
      responses:
        '200': { $ref: '#/components/responses/NetworkOK' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [operations]
      operationId: putNetworkRule
      summary: Idempotently apply a runtime MASQUERADE rule / 幂等应用运行时规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkPut' }
      responses:
        '200': { $ref: '#/components/responses/NetworkOK' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Optional; required only when GSM_API_TOKEN is configured / 可选 Bearer 令牌
  parameters:
    PresetID:
      name: id
      in: path
      required: true
      description: Stable lowercase preset slug / 稳定的小写预设 slug
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', example: '0' }
    IMSI:
      name: imsi
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]{15}$', example: '001010000000000' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
  schemas:
    Envelope:
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      properties:
        code: { type: integer, description: '0 on success; HTTP*100+1 on error', example: 0 }
        message: { type: string, example: ok }
        data: { type: object, nullable: true, additionalProperties: true }
        request_id: { type: string, minLength: 1, example: REQUEST_ID }
    FieldError:
      type: object
      required: [field, reason]
      additionalProperties: false
      properties:
        field: { type: string, example: FIELD }
        reason: { type: string, example: REASON }
    ValidationData:
      type: object
      required: [errors]
      additionalProperties: false
      properties:
        errors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FieldError' }
    CellParams:
      type: object
      required: [arfcns, c0, band, mcc, mnc, lac, ci, short_name, network]
      additionalProperties: false
      properties:
        arfcns: { type: string, enum: ['1'] }
        c0: { type: string, pattern: '^[0-9]+$', example: '540' }
        band: { type: string, enum: ['900', '1800'] }
        mcc: { type: string, pattern: '^[0-9]{3}$', example: '001' }
        mnc: { type: string, pattern: '^[0-9]{2,3}$', example: '01' }
        lac: { type: string, pattern: '^[0-9]+$', example: '1' }
        ci: { type: string, pattern: '^[0-9]+$', example: '1' }
        short_name: { type: string, example: LAB }
        network:
          type: string
          example: eth0
          description: Required interface inside the container; the default bridge uses eth0 / 容器内部必填网卡，默认 bridge 使用 eth0
    CellStartFromPreset:
      type: object
      required: [preset_id]
      additionalProperties: false
      properties:
        preset_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', example: '0' }
    EmptyCellStart:
      type: object
      maxProperties: 0
      additionalProperties: false
      description: Reuse the existing complete valid last profile / 复用已有完整有效的上次存档
    CellStart:
      description: Exactly one mode; preset_id cannot be mixed with explicit fields / 三种模式三选一
      oneOf:
        - $ref: '#/components/schemas/CellParams'
        - $ref: '#/components/schemas/CellStartFromPreset'
        - $ref: '#/components/schemas/EmptyCellStart'
    Preset:
      type: object
      required: [id, name, description, params]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', example: lab-900 }
        name: { type: string, minLength: 1, example: Lab 900 }
        description: { type: string, example: Indoor fixture }
        params: { $ref: '#/components/schemas/CellParams' }
    PresetCreate:
      type: object
      required: [id, name, params]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', example: lab-900 }
        name: { type: string, minLength: 1, example: Lab 900, description: 1..128 UTF-8 bytes / UTF-8 1..128 字节 }
        description: { type: string, example: Indoor fixture, description: Optional; at most 2048 UTF-8 bytes / 可选，UTF-8 最多 2048 字节 }
        params: { $ref: '#/components/schemas/CellParams' }
    PresetUpdate:
      type: object
      required: [name, params]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, example: Lab 900 updated, description: 1..128 UTF-8 bytes / UTF-8 1..128 字节 }
        description: { type: string, example: Updated fixture, description: Optional; omitted means empty; at most 2048 UTF-8 bytes / 可选，省略即空，最多 2048 字节 }
        params: { $ref: '#/components/schemas/CellParams' }
    PresetList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Preset' } }
    PresetDeleted:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted: { type: boolean, enum: [true] }
    ConfigPatch:
      type: object
      description: Atomically updates a non-empty subset of the eight public radio/identity keys; other native OpenBTS keys are read-only through this API / 原子更新八个公开无线/标识键的非空子集；其他原生 OpenBTS 键只读
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            GSM.Radio.ARFCNs: { type: string }
            GSM.Radio.C0: { type: string }
            GSM.Radio.Band: { type: string }
            GSM.Identity.MCC: { type: string }
            GSM.Identity.MNC: { type: string }
            GSM.Identity.LAC: { type: string }
            GSM.Identity.CI: { type: string }
            GSM.Identity.ShortName: { type: string }
          example: { GSM.Identity.ShortName: LAB }
    NumberBinding:
      type: object
      required: [number]
      additionalProperties: false
      properties:
        number:
          type: string
          pattern: '^[0-9]{2,15}$'
          example: '10000'
          description: Unique; 101, 411, 111, 112, 911, 2600, and 2602 are reserved and rejected / 短信服务、语音诊断及其他保留号码不可绑定
    SMSSubmit:
      type: object
      required: [imsi, sender, text]
      additionalProperties: false
      properties:
        imsi: { type: string, pattern: '^[0-9]{15}$', example: '001010000000000' }
        sender: { type: string, pattern: '^[0-9]{2,15}$', example: '10000' }
        text:
          type: string
          minLength: 1
          maxLength: 159
          example: hello
          description: Maximum 159 bytes; see API.md for the exact safe alphabet / 最多159字节
    NetworkPut:
      type: object
      required: [iface]
      additionalProperties: false
      properties:
        iface: { type: string, example: eth0 }
    HistoryWindow:
      type: object
      required: [bytes, max_bytes, truncated]
      additionalProperties: false
      properties:
        bytes: { type: integer, format: int64, minimum: 0 }
        max_bytes: { type: integer, format: int64, minimum: 65536, maximum: 67108864, example: 8388608 }
        truncated: { type: boolean }
    Connection:
      type: object
      required: [imsi, imei, number, ip]
      properties:
        imsi: { type: string, pattern: '^[0-9]{15}$' }
        imei: { type: string, nullable: true }
        number: { type: string, nullable: true }
        number_source:
          type: string
          nullable: true
          enum: [subscriber_registry, openbts_tmsi, inconsistent_registry]
          description: Optional provenance of the resolved number. Registry bindings and authoritative unbindings override stale TMSI values; inconsistent registry state forces number null. The field is null when no source is evidenced. / 可选号码解析来源；签约库绑定及权威解绑覆盖陈旧 TMSI，签约库不一致时号码强制为空，无来源证据时本字段为空
        ip: { type: string, nullable: true, description: Handset packet-data address observed after GPRS/PDP setup; null does not diagnose NAT / GPRS/PDP 后观察到的手机数据地址；null 不用于诊断 NAT }
        auth:
          type: integer
          nullable: true
          description: Optional additive native AUTH record value (0 unauthorized, 1 registrar-authorized, 2 open-registration, 3 fail-open); no value is a live online indicator / 可选新增原生 AUTH 记录值（0 未授权、1 Registrar 授权、2 开放注册、3 失败时开放）；均非实时在线指标
        reject_code:
          type: integer
          nullable: true
          description: Optional additive native rejection code; code 4 alone does not identify a unique cause or prove a Ki mismatch / 可选新增原生拒绝码；仅凭 4 不能确定唯一原因或断定 Ki 错误
    Subscriber:
      type: object
      required: [imsi, number, binding_consistent]
      properties:
        imsi: { type: string, pattern: '^[0-9]{15}$' }
        number: { type: string, nullable: true }
        binding_consistent: { type: boolean }
    SMSMessage:
      type: object
      description: One smqueue log observation, optionally completed from a unique consistent current subscriber binding; current bindings are query-time context, not historical facts or delivery receipts / 一条 smqueue 日志观察；仅可由唯一且一致的当前签约绑定补全；当前绑定只是查询时上下文，不是历史事实或送达回执
      required: [time, text, sender_number, sender_imsi, receiver_number, receiver_imsi, identity_resolution]
      properties:
        time: { type: string, format: date-time, nullable: true, description: RFC3339Nano in the project time zone with offset / 项目时区的带偏移时间 }
        text: { type: string, nullable: true }
        sender_number: { type: string, nullable: true }
        sender_imsi: { type: string, nullable: true }
        receiver_number: { type: string, nullable: true }
        receiver_imsi: { type: string, nullable: true }
        identity_resolution: { $ref: '#/components/schemas/SMSIdentityResolution' }
    SMSObservationSession:
      type: object
      nullable: true
      additionalProperties: false
      description: Latest known cell-start observation scope; null after manager recreation or failure of an accepted start attempt; rejected inputs and duplicate-start 409 preserve it / 最近已知小区启动范围；管理进程重建或已接受启动尝试失败后为空；参数拒绝与重复启动 409 保留边界
      required: [id, started_at, ended_at, state]
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [starting, running, stopped, boundary_lost] }
    SMSIdentityResolution:
      type: object
      additionalProperties: false
      description: Per-field provenance. current_subscriber_binding means the value was completed from the unique consistent binding at query time and must not be treated as message-time history; unknown means no conservative completion was possible. Log observations are never overwritten. / 逐字段来源。current_subscriber_binding 表示由查询时唯一且一致的当前绑定补全，不得视为消息发生时的历史事实；unknown 表示无法保守补全。日志观察值绝不覆盖。
      required: [sender_number, sender_imsi, receiver_number, receiver_imsi]
      properties:
        sender_number: { $ref: '#/components/schemas/SMSIdentitySource' }
        sender_imsi: { $ref: '#/components/schemas/SMSIdentitySource' }
        receiver_number: { $ref: '#/components/schemas/SMSIdentitySource' }
        receiver_imsi: { $ref: '#/components/schemas/SMSIdentitySource' }
    SMSIdentitySource:
      type: string
      enum: [log_observation, current_subscriber_binding, unknown]
    NetworkState:
      type: object
      required: [iface, rule_present, ipv4_forwarding, persisted]
      properties:
        iface: { type: string }
        rule_present: { type: boolean, description: Managed rule only; not proof of forwarding }
        changed: { type: boolean, description: Present on PUT responses }
        ipv4_forwarding: { type: boolean, nullable: true, description: Read-only / 只读 }
        persisted: { type: boolean, enum: [false] }
    ActiveCall:
      type: object
      required: [channel, context, extension, state, application, caller_id, duration_seconds, bridge_id, unique_id]
      properties:
        channel: { type: string }
        context: { type: string }
        extension: { type: string }
        state: { type: string }
        application: { type: string }
        caller_id: { type: string }
        duration_seconds: { type: integer, minimum: 0 }
        bridge_id: { type: string, nullable: true, description: Asterisk bridge UUID; not a channel name }
        unique_id: { type: string, nullable: true }
    HistoryCall:
      type: object
      required: [account_code, source, destination, destination_context, caller_id, channel, destination_channel, last_application, last_data, started_at, answered_at, ended_at, duration_seconds, billed_seconds, disposition, ama_flags, unique_id, user_field]
      properties:
        account_code: { type: string }
        source: { type: string }
        destination: { type: string }
        destination_context: { type: string }
        caller_id: { type: string }
        channel: { type: string }
        destination_channel: { type: string }
        last_application: { type: string }
        last_data: { type: string }
        started_at: { type: string, format: date-time, description: RFC3339 in project TZ / 项目时区 }
        answered_at: { type: string, format: date-time, nullable: true, description: RFC3339 in project TZ / 项目时区 }
        ended_at: { type: string, format: date-time, description: RFC3339 in project TZ / 项目时区 }
        duration_seconds: { type: integer, minimum: 0 }
        billed_seconds: { type: integer, minimum: 0 }
        disposition: { type: string }
        ama_flags: { type: string }
        unique_id: { type: string, nullable: true }
        user_field: { type: string, nullable: true }
    CellStatus:
      type: object
      required: [state, ready, sms_ready, voice_ready, transitioning, running, openbts, transceiver, sipauthserve, smqueue, asterisk]
      properties:
        state: { type: string, enum: [stopped, transitioning, degraded, running] }
        ready: { type: boolean, description: Five managed processes alive; not RF acceptance }
        sms_ready: { type: boolean }
        voice_ready: { type: boolean }
        transitioning: { type: boolean }
        running: { type: boolean }
        openbts: { type: boolean }
        transceiver: { type: boolean }
        sipauthserve: { type: boolean }
        smqueue: { type: boolean }
        asterisk: { type: boolean }
        started_at: { type: string, format: date-time }
        band: { type: string }
        short_name: { type: string }
  responses:
    PresetListOK:
      description: Complete sorted collection; a new store has five defaults / 完整有序预设列表，新库初始有五项
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PresetList' }
          example:
            code: 0
            message: ok
            data:
              items:
                - { id: '0', name: addx, description: '', params: { arfcns: '1', c0: '540', band: '1800', mcc: '001', mnc: '01', lac: '1', ci: '1', short_name: addx, network: eth0 } }
                - { id: '1', name: ChinaMobile, description: '', params: { arfcns: '1', c0: '55', band: '900', mcc: '460', mnc: '00', lac: '1', ci: '1', short_name: ChinaMobile, network: eth0 } }
                - { id: '2', name: ChinaMobile, description: '', params: { arfcns: '1', c0: '540', band: '1800', mcc: '460', mnc: '00', lac: '1', ci: '1', short_name: ChinaMobile, network: eth0 } }
                - { id: '3', name: ChinaUnicom, description: '', params: { arfcns: '1', c0: '70', band: '900', mcc: '460', mnc: '01', lac: '1', ci: '1', short_name: ChinaUnicom, network: eth0 } }
                - { id: '4', name: ChinaUnicom, description: '', params: { arfcns: '1', c0: '668', band: '1800', mcc: '460', mnc: '01', lac: '1', ci: '1', short_name: ChinaUnicom, network: eth0 } }
            request_id: REQUEST_ID
    PresetOK:
      description: Preset object / 预设对象
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Preset' }
    PresetCreated:
      description: Preset created; no cell is started / 预设已创建，不启动小区
      headers:
        Location:
          description: Canonical preset resource path / 预设资源路径
          schema: { type: string, example: /api/v1/presets/lab-900 }
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Preset' }
    PresetDeleted:
      description: Preset deleted; running cell and last profile are unchanged / 预设已删除，运行小区与上次存档不变
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PresetDeleted' }
    Success:
      description: Successful JSON envelope / 成功包络
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Accepted:
      description: Submitted, not delivered / 已提交，不代表送达
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { code: 0, message: sms submitted, data: { status: submitted, imsi: IMSI }, request_id: REQUEST_ID }
    CellStatusOK:
      description: Managed process status / 托管进程状态
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/CellStatus' }
    ConnectionsOK:
      description: Paginated volatile registration/TMSI observations with an authoritative subscriber-registry number overlay; rows are not an admitted or online-device list / 分页易失注册/TMSI 观察并叠加权威签约库号码；不是已入网或在线名单
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [connections, count, total, limit, offset, source, window, truncated]
                    properties:
                      connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
                      count: { type: integer }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      source: { type: string, enum: [openbts_tmsi_sgsn] }
                      window: { type: string, enum: [current_snapshot] }
                      truncated: { type: boolean, enum: [false] }
    SubscribersOK:
      description: Paginated persistent registry / 分页持久签约
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [subscribers, count, total, limit, offset, source, window, truncated]
                    properties:
                      subscribers: { type: array, items: { $ref: '#/components/schemas/Subscriber' } }
                      count: { type: integer }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      source: { type: string, enum: [asterisk_registry] }
                      window: { type: string, enum: [full] }
                      truncated: { type: boolean, enum: [false] }
    SMSListOK:
      description: Paginated bounded current-start SMS observations, deduplicated by message identity and not delivery receipts / 本轮启动的分页有界短信观察，按消息身份去重且不是送达回执
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [sms, count, total, limit, offset, source, scope, timezone, session, window, truncated]
                    properties:
                      sms: { type: array, items: { $ref: '#/components/schemas/SMSMessage' } }
                      count: { type: integer }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      source: { type: string, enum: [smqueue.log] }
                      scope: { type: string, enum: [current_start] }
                      timezone: { type: string, example: Asia/Shanghai, description: Startup-configured IANA time zone from TZ / TZ 配置的项目启动时区 }
                      session: { $ref: '#/components/schemas/SMSObservationSession' }
                      window: { $ref: '#/components/schemas/HistoryWindow' }
                      truncated: { type: boolean }
    ActiveCallsOK:
      description: Paginated active channels / 分页活动通道
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [calls, count, total, limit, offset, source, window, truncated]
                    properties:
                      calls: { type: array, items: { $ref: '#/components/schemas/ActiveCall' } }
                      count: { type: integer }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      source: { type: string, enum: [asterisk_active_channels] }
                      window: { type: string, enum: [current_snapshot] }
                      truncated: { type: boolean, enum: [false] }
    CallHistoryOK:
      description: Paginated bounded CDR rows / 分页有界话单
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [calls, count, total, limit, offset, source, window, truncated]
                    properties:
                      calls: { type: array, items: { $ref: '#/components/schemas/HistoryCall' } }
                      count: { type: integer }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      source: { type: string, enum: [Master.csv] }
                      window: { $ref: '#/components/schemas/HistoryWindow' }
                      truncated: { type: boolean }
    NetworkOK:
      description: Managed runtime rule state / 运行时规则状态
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/NetworkState' }
    Error:
      description: Error JSON envelope / 错误包络
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ValidationError:
      description: Validation error / 校验错误
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ValidationData' }
