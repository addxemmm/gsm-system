name: ci
on:
  push:
    branches: [master, folk/**]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.26.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh deploy/docker/test-persistent-state.sh
      - run: GOOS=linux GOARCH=amd64 go build -o /tmp/gsm-system ./cmd/server
